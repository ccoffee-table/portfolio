<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Name - Your Name</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .poster-layout {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #2f3d7e;
        }

        /* Center hero image */
        .poster-hero {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50%;
            height: 70%;
            z-index: 1;
        }

        .poster-hero img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Side images grid */
        .poster-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            padding: 20px;
            z-index: 0;
        }

        .poster-grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        /* Grid positioning */
        .g-1-1 { grid-column: 1; grid-row: 1; }
        .g-2-1 { grid-column: 2; grid-row: 1; }
        .g-4-1 { grid-column: 4; grid-row: 1; }
        .g-5-1 { grid-column: 5; grid-row: 1; }
        .g-1-2 { grid-column: 1; grid-row: 2; }
        .g-1-3 { grid-column: 1; grid-row: 3; }
        .g-5-3 { grid-column: 5; grid-row: 3; }
        .g-1-4 { grid-column: 1; grid-row: 4; }
        .g-1-5 { grid-column: 1; grid-row: 5; }
        .g-2-5 { grid-column: 2; grid-row: 5; }
        .g-4-5 { grid-column: 4; grid-row: 5; }

        /* Title overlay */
        .poster-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            font-size: 120px;
            font-weight: 900;
            color: #ff1493;
            text-shadow: 
                -4px -4px 0 #fff,
                4px -4px 0 #fff,
                -4px 4px 0 #fff,
                4px 4px 0 #fff,
                0 0 20px rgba(0,0,0,0.5);
            letter-spacing: 0.05em;
            text-align: center;
            line-height: 0.9;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="nav"></div>

    <div class="poster-layout">
        <!-- Background grid of small images -->
        <div class="poster-grid">
            <img src="images/process1.png" class="g-1-1">
            <img src="images/process2.png" class="g-2-1">
            <img src="images/process2.png" class="g-4-1">                       
            <img src="images/process1.png" class="g-5-1">   
        </div>

        <!-- Center hero image -->
        <div class="poster-hero">
            <img src="images/hero-character.png" alt="Main character">
        </div>

        <!-- Title overlay -->
        <div class="poster-title">
            PROJECT<br>TITLE
        </div>
    </div>

    <script src="nav.js"></script>
</body>
</html>
